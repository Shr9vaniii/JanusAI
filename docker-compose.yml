services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RAG_BACKEND: remote
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      # Mount prebuilt retrieval artifacts (not in git)
      - ./enterprise_data:/app/enterprise_data
    restart: unless-stopped
    # Presentation UI is baked in via Dockerfile multi-stage (web/ → web/dist).
    # Open http://localhost:8000 — scenario chips + citations.
    # Set INFERENCE_URL to your RunPod proxy before sharing publicly.
